<body>
  <div class="blobs" aria-hidden="true"><span></span><span></span></div>
  <div class="side-marquee left" aria-hidden="true"><div>aura farming · 6-7 · mogging · crash out · aura farming · 6-7 · mogging · crash out ·</div></div>
  <div class="side-marquee right" aria-hidden="true"><div>7x7=49 · twin · unc · womp womp · 7x7=49 · twin · unc · womp womp ·</div></div>

  <div class="app">
    <header class="topbar">
      <a href="#/profile" class="me-link" id="meLink" aria-label="Your profile"></a>
      <a href="#/" class="logo" aria-label="AuraHire home">aurahire</a>
      <a href="#/profile" class="aura-pill" id="auraPill" aria-label="Your aura, open profile">aura: 0</a>
      <button class="icon-btn sound-btn" id="soundBtn" aria-label="Sound effects" aria-pressed="true">🔊</button>
      <button class="icon-btn" id="vibeBtn" aria-label="Change vibe (theme)" aria-expanded="false">vibe</button>
    </header>

    <main id="screen" class="screen" aria-live="polite"></main>
  </div>

  <!-- Bottom tabs on the "social" screens (shown/hidden by CSS using body[data-route]) -->
  <nav class="tabbar" aria-label="Main">
    <a class="tab" data-tab="jobs" href="#/jobs"><span aria-hidden="true">🔥</span>swipe</a>
    <a class="tab" data-tab="people" href="#/people"><span aria-hidden="true">👀</span>the batch</a>
    <a class="tab" data-tab="chat" href="#/chat"><span aria-hidden="true">💬</span>hr chat</a>
    <a class="tab" data-tab="profile" href="#/profile"><span aria-hidden="true">🪪</span>me</a>
  </nav>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="sheet" id="vibeSheet" aria-label="Choose a vibe" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <p class="label">pick your vibe</p>
    <h2 class="h2">the app, but in your aura.</h2>
    <div class="vibe-list" id="vibeList"></div>
  </aside>

  <div class="toast" id="toast" role="status"></div>

  <noscript><p style="padding:24px">AuraHire needs JavaScript. Your aura without it: -1000.</p></noscript>
  <!-- GSAP (free, incl. plugins) and Lenis are bundled locally in /vendor -->
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/ScrollTrigger.min.js"></script>
  <script src="vendor/ScrambleTextPlugin.min.js"></script>
  <script src="vendor/lenis.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
